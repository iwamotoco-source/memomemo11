<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════
   CSS Variables
═══════════════════════════════════════ */
:root{
  --bg:#f2f2f7;--sidebar-bg:#f2f2f7;--list-bg:#ffffff;--detail-bg:#ffffff;
  --card-bg:#ffffff;--card-hover:#f5f5f5;--card-sel:#fff8cc;
  --border:#d1d1d6;--border-light:#e5e5ea;
  --text-p:#000000;--text-s:#3c3c43;--text-m:#8e8e93;--text-b:#1c1c1e;
  --accent:#FFD60A;--accent-d:#b8960a;--accent-t:#1c1c1e;
  --btn:#e5e5ea;--btn-h:#d1d1d6;
  --tb-bg:rgba(242,242,247,0.94);
  --overlay:rgba(0,0,0,.38);
  --sh-sm:0 1px 3px rgba(0,0,0,.08);
  --sh-md:0 4px 16px rgba(0,0,0,.12);
  --sh-lg:0 12px 40px rgba(0,0,0,.18);
  --r:12px;--rs:8px;
  --font:'Inter','Noto Sans JP',sans-serif;
  --sync-ok:#30d158;--sync-err:#ff453a;--sync-ing:#007aff;
}
[data-theme="dark"]{
  --bg:#000000;--sidebar-bg:#1c1c1e;--list-bg:#1c1c1e;--detail-bg:#1c1c1e;
  --card-bg:#2c2c2e;--card-hover:#3a3a3c;--card-sel:#3d3200;
  --border:#38383a;--border-light:#2c2c2e;
  --text-p:#ffffff;--text-s:#ebebf5;--text-m:#636366;--text-b:#ebebf5;
  --btn:#2c2c2e;--btn-h:#3a3a3c;
  --tb-bg:rgba(28,28,30,0.94);
  --sh-sm:0 1px 3px rgba(0,0,0,.5);
  --sh-md:0 4px 16px rgba(0,0,0,.55);
  --sh-lg:0 12px 40px rgba(0,0,0,.72);
}

/* ═══ Reset ═══ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:var(--font);transition:background .25s,color .25s}
body{background:var(--bg);color:var(--text-p);display:flex;flex-direction:column}

/* ═══════════════════════════════════════
   Setup Screen
═══════════════════════════════════════ */
#setupScreen{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;padding:24px;
  transition:background .25s;
}
.setup-card{
  background:var(--card-bg);border-radius:20px;
  padding:36px 32px;width:100%;max-width:430px;
  box-shadow:var(--sh-lg);text-align:center;
  transition:background .25s;
}
.setup-logo{font-size:3.6rem;margin-bottom:6px;line-height:1}
.setup-title{font-size:1.4rem;font-weight:800;margin-bottom:6px;color:var(--text-p)}
.setup-desc{font-size:.875rem;color:var(--text-m);margin-bottom:24px;line-height:1.6}
.setup-label{display:block;text-align:left;font-size:.75rem;font-weight:700;color:var(--text-m);text-transform:uppercase;letter-spacing:.9px;margin:14px 0 5px}
.setup-input{
  width:100%;padding:12px 14px;background:var(--bg);
  border:1.5px solid var(--border);border-radius:var(--rs);
  color:var(--text-p);font-size:.95rem;font-family:var(--font);
  transition:border-color .15s,background .25s;
}
.setup-input:focus{outline:none;border-color:var(--accent-d)}
.setup-input::placeholder{color:var(--text-m)}
.setup-hint{font-size:.76rem;color:var(--text-m);text-align:left;margin-top:5px;line-height:1.5}
.setup-hint a{color:var(--sync-ing);text-decoration:none}
.setup-hint a:hover{text-decoration:underline}
#setupError{color:var(--sync-err);font-size:.82rem;margin-top:10px;min-height:18px;line-height:1.4}
.setup-btn-primary{
  margin-top:22px;width:100%;padding:14px;
  background:var(--accent);border:none;border-radius:var(--rs);
  font-size:1rem;font-weight:700;color:var(--accent-t);
  cursor:pointer;transition:opacity .15s,transform .1s;
  font-family:var(--font);
}
.setup-btn-primary:hover{opacity:.86}
.setup-btn-primary:active{transform:scale(.98)}
.setup-btn-primary:disabled{opacity:.5;cursor:not-allowed}
.setup-skip{margin-top:12px;background:none;border:none;color:var(--text-m);font-size:.86rem;cursor:pointer;text-decoration:underline;font-family:var(--font)}

/* Theme toggle in setup */
.setup-theme-row{display:flex;justify-content:center;margin-bottom:4px}
.theme-toggle-btn{
  background:var(--btn);border:none;border-radius:999px;
  padding:6px 16px;font-size:.82rem;font-weight:600;color:var(--text-s);
  cursor:pointer;transition:background .15s;font-family:var(--font);
}
.theme-toggle-btn:hover{background:var(--btn-h)}

/* ═══════════════════════════════════════
   App Shell
═══════════════════════════════════════ */
#app{display:flex;flex:1;overflow:hidden;height:100%}
#app.hidden{display:none}

/* ═══ Sidebar ═══ */
#sidebar{
  width:256px;min-width:200px;background:var(--sidebar-bg);
  border-right:1px solid var(--border-light);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
  transition:background .25s;
}
.sidebar-header{padding:52px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between}
.sidebar-title{font-size:1.25rem;font-weight:800;color:var(--text-p)}
.sb-hdr-btns{display:flex;gap:4px}
.sidebar-search{
  margin:0 10px 8px;display:flex;align-items:center;gap:7px;
  background:var(--btn);border-radius:var(--rs);padding:7px 10px;
}
.sidebar-search input{flex:1;background:none;border:none;font-size:.87rem;color:var(--text-p);font-family:var(--font)}
.sidebar-search input:focus{outline:none}
.sidebar-search input::placeholder{color:var(--text-m)}
.folder-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.folder-sec{font-size:.7rem;font-weight:700;color:var(--text-m);text-transform:uppercase;letter-spacing:.9px;padding:8px 10px 3px}
.folder-item{
  display:flex;align-items:center;gap:9px;
  padding:8px 10px;border-radius:var(--rs);cursor:pointer;
  transition:background .12s;
}
.folder-item:hover{background:var(--card-hover)}
.folder-item.active{background:var(--accent);color:var(--accent-t)}
.folder-item.active .fi-cnt{opacity:.6}
.fi-icon{font-size:1rem;width:20px;text-align:center;flex-shrink:0}
.fi-name{flex:1;font-size:.88rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-cnt{font-size:.76rem;color:var(--text-m);font-weight:500}
.sidebar-footer{
  padding:10px;border-top:1px solid var(--border-light);
  display:flex;align-items:center;gap:6px;
}
.sb-foot-btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  padding:8px;background:var(--btn);border:none;border-radius:var(--rs);
  color:var(--text-s);font-size:.78rem;font-weight:600;cursor:pointer;
  transition:background .12s;font-family:var(--font);
}
.sb-foot-btn:hover{background:var(--btn-h)}
#syncBadge{
  width:9px;height:9px;border-radius:50%;background:var(--text-m);
  flex-shrink:0;transition:background .3s;
}
#syncBadge.ok{background:var(--sync-ok)}
#syncBadge.err{background:var(--sync-err)}
#syncBadge.syncing{background:var(--sync-ing);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ═══ Note List ═══ */
#noteList{
  width:290px;min-width:220px;background:var(--list-bg);
  border-right:1px solid var(--border-light);
  display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;
  transition:background .25s;
}
.list-header{padding:52px 14px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.list-title{font-size:1.15rem;font-weight:800;color:var(--text-p);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-hdr-btns{display:flex;gap:4px;flex-shrink:0}
.icon-btn{
  width:30px;height:30px;border-radius:50%;border:none;
  background:var(--btn);color:var(--text-s);font-size:.95rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s;flex-shrink:0;
}
.icon-btn:hover{background:var(--btn-h)}
.icon-btn.accent{background:var(--accent);color:var(--accent-t)}
.list-meta{padding:0 14px 6px;display:flex;align-items:center;justify-content:space-between}
.list-cnt{font-size:.76rem;color:var(--text-m)}
.list-sort-sel{font-size:.76rem;color:var(--text-m);background:none;border:none;cursor:pointer;font-family:var(--font)}
.list-sort-sel:focus{outline:none}
.note-cards{flex:1;overflow-y:auto;padding:0 6px 8px}
.note-card{
  padding:11px 12px;border-radius:var(--rs);cursor:pointer;
  transition:background .12s;margin-bottom:2px;position:relative;overflow:hidden;
}
.note-card:hover{background:var(--card-hover)}
.note-card.active{background:var(--card-sel)}
.nc-title{font-size:.9rem;font-weight:600;color:var(--text-p);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.nc-meta{display:flex;align-items:center;gap:5px;font-size:.74rem;color:var(--text-m);margin-bottom:2px}
.nc-prev{font-size:.77rem;color:var(--text-m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-actions{
  position:absolute;right:0;top:0;bottom:0;display:flex;
  transform:translateX(100%);transition:transform .18s;
}
.note-card:hover .nc-actions{transform:translateX(0)}
.nca-btn{
  height:100%;padding:0 10px;border:none;cursor:pointer;
  font-size:.78rem;font-weight:600;color:#fff;
  display:flex;align-items:center;justify-content:center;
}
.nca-pin{background:#ff9f0a}
.nca-del{background:#ff453a;border-radius:0 var(--rs) var(--rs) 0}
.list-empty{text-align:center;padding:50px 20px;color:var(--text-m);font-size:.88rem}
.list-empty-icon{font-size:2.8rem;margin-bottom:10px}

/* ═══ Note Detail ═══ */
#noteDetail{flex:1;display:flex;flex-direction:column;background:var(--detail-bg);overflow:hidden;transition:background .25s}
.detail-empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--text-m);gap:10px;padding-bottom:60px;
}
.de-icon{font-size:4rem;opacity:.25}
.de-text{font-size:1rem;font-weight:500}

/* Toolbar */
.detail-toolbar{
  padding:52px 14px 8px;
  display:flex;align-items:center;gap:5px;
  border-bottom:1px solid var(--border-light);
  background:var(--tb-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  flex-shrink:0;
}
.dt-left{display:flex;align-items:center;gap:4px;flex:1}
.dt-right{display:flex;align-items:center;gap:4px}
.dt-note-meta{flex:1;text-align:center;font-size:.76rem;color:var(--text-m)}

/* Format bar */
.fmt-bar{
  display:flex;align-items:center;gap:2px;
  padding:5px 10px;border-bottom:1px solid var(--border-light);
  background:var(--tb-bg);backdrop-filter:blur(20px);
  overflow-x:auto;flex-shrink:0;
}
.fmt-bar::-webkit-scrollbar{display:none}
.fb{
  min-width:30px;height:28px;border-radius:6px;border:none;
  background:transparent;color:var(--text-s);font-size:.85rem;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:0 7px;transition:background .1s,color .1s;white-space:nowrap;font-family:var(--font);
}
.fb:hover{background:var(--btn-h)}
.fb.active{background:var(--accent);color:var(--accent-t)}
.fb-sep{width:1px;height:18px;background:var(--border);margin:0 2px;flex-shrink:0}

/* Editor */
.editor-wrap{flex:1;overflow-y:auto;padding:18px 22px 100px}
#editor{
  min-height:100%;outline:none;font-family:var(--font);
  font-size:1rem;line-height:1.75;color:var(--text-b);
  caret-color:var(--accent-d);
  word-break:break-word;
}
#editor:empty::before{content:attr(data-placeholder);color:var(--text-m);pointer-events:none}
#editor h1{font-size:1.55rem;font-weight:800;line-height:1.2;margin:4px 0;color:var(--text-p)}
#editor h2{font-size:1.2rem;font-weight:700;line-height:1.3;margin:3px 0;color:var(--text-p)}
#editor h3{font-size:1rem;font-weight:700;line-height:1.4;margin:2px 0;color:var(--text-p)}
#editor ul,#editor ol{padding-left:22px;margin:3px 0}
#editor li{margin:2px 0}
#editor blockquote{border-left:3px solid var(--accent-d);padding-left:12px;color:var(--text-m);margin:6px 0;font-style:italic}
#editor mark{background:rgba(255,214,10,.38);border-radius:2px;padding:0 2px}
#editor hr{border:none;border-top:1px solid var(--border);margin:10px 0}
#editor a{color:var(--sync-ing)}
#editor img{
  max-width:100%;border-radius:8px;display:block;margin:8px 0;
  cursor:pointer;box-shadow:var(--sh-sm);
  transition:box-shadow .15s;
}
#editor img:hover{box-shadow:var(--sh-md)}
#editor img.img-selected{outline:2.5px solid var(--accent-d);outline-offset:2px}
#editor input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent-d);margin-right:5px;cursor:pointer}

/* Word count bar */
.wc-bar{padding:5px 22px;font-size:.73rem;color:var(--text-m);text-align:right;border-top:1px solid var(--border-light);flex-shrink:0}

/* ═══════════════════════════════════════
   Image Resize Overlay
═══════════════════════════════════════ */
#imgOverlay{
  position:fixed;inset:0;z-index:800;pointer-events:none;display:none;
}
.img-resize-handle{
  position:absolute;width:10px;height:10px;
  background:var(--accent);border-radius:2px;
  pointer-events:all;cursor:se-resize;
}

/* ═══════════════════════════════════════
   Modals
═══════════════════════════════════════ */
.modal-bg{
  position:fixed;inset:0;background:var(--overlay);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-bg.show{opacity:1;pointer-events:all}
.modal-box{
  background:var(--card-bg);border-radius:18px;padding:26px 22px 18px;
  width:100%;max-width:340px;box-shadow:var(--sh-lg);
  transform:scale(.94);transition:transform .2s,background .25s;
}
.modal-bg.show .modal-box{transform:scale(1)}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:14px;color:var(--text-p)}
.modal-input{
  width:100%;padding:10px 12px;background:var(--bg);
  border:1.5px solid var(--border);border-radius:var(--rs);
  color:var(--text-p);font-size:.92rem;font-family:var(--font);
}
.modal-input:focus{outline:none;border-color:var(--accent-d)}
.modal-btns{display:flex;gap:8px;margin-top:14px}
.mbtn{
  flex:1;padding:10px;border-radius:var(--rs);border:none;
  font-size:.9rem;font-weight:600;cursor:pointer;font-family:var(--font);
  transition:opacity .12s;
}
.mbtn:hover{opacity:.82}
.mbtn.cancel{background:var(--btn);color:var(--text-s)}
.mbtn.confirm{background:var(--accent);color:var(--accent-t)}
.mbtn.danger{background:var(--sync-err);color:#fff}

/* Move folder list */
.mfl-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 10px;border-radius:var(--rs);cursor:pointer;
  transition:background .12s;margin-bottom:3px;
  font-size:.88rem;color:var(--text-s);
  border:none;background:transparent;width:100%;text-align:left;font-family:var(--font);
}
.mfl-item:hover{background:var(--card-hover)}

/* ═══════════════════════════════════════
   Image Insert Modal
═══════════════════════════════════════ */
.img-drop-zone{
  border:2px dashed var(--border);border-radius:var(--rs);
  padding:28px 16px;text-align:center;cursor:pointer;
  position:relative;transition:border-color .18s,background .18s;
  margin-bottom:10px;
}
.img-drop-zone:hover,.img-drop-zone.over{border-color:var(--accent-d);background:rgba(255,214,10,.06)}
.img-drop-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.img-drop-zone p{color:var(--text-m);font-size:.82rem;margin-top:5px}
#imgUrlInput{margin-top:8px}

/* ═══ Toast ═══ */
#toast{
  position:fixed;bottom:32px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:rgba(58,58,60,.92);color:#fff;border-radius:999px;
  padding:9px 22px;font-size:.86rem;font-weight:500;
  z-index:9997;pointer-events:none;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(20px);white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ═══ Scrollbar ═══ */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

/* ═══ Responsive ═══ */
@media(max-width:768px){
  #sidebar{
    position:fixed;left:0;top:0;bottom:0;z-index:200;width:260px;
    transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    box-shadow:var(--sh-lg);
  }
  #sidebar.open{transform:translateX(0)}
  #noteList{position:fixed;inset:0;z-index:100;width:100%;min-width:unset}
  #noteList.hidden-m{display:none}
  #noteDetail{position:fixed;inset:0;z-index:150}
  #noteDetail.hidden-m{display:none}
  .detail-toolbar,.list-header,.sidebar-header{padding-top:54px}
  .nc-actions{transform:none;position:static;height:auto;margin-top:4px}
  .nca-btn{border-radius:var(--rs);height:26px;padding:0 9px}
}
@media(min-width:769px){.back-btn{display:none!important}}
</style>

<body>

<!-- ══════ SETUP ══════ -->
<div id="setupScreen">
  <div class="setup-card">
    <div class="setup-theme-row">
      <button class="theme-toggle-btn" id="setupThemeBtn">🌙 ダークモード</button>
    </div>
    <div class="setup-logo">📝</div>
    <div class="setup-title">Notes</div>
    <div class="setup-desc">GitHub Gist でノートをクラウド同期します。<br/>Personal Access Token を入力してください。</div>
    <label class="setup-label">GitHub Personal Access Token</label>
    <input class="setup-input" type="password" id="setupToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false"/>
    <div class="setup-hint">
      <a href="https://github.com/settings/tokens/new?scopes=gist&description=Notes+App" target="_blank">ここをクリック</a>してトークン発行 → scopes: <b>gist</b> にチェック
    </div>
    <div id="setupError"></div>
    <button class="setup-btn-primary" id="setupBtn">接続してはじめる</button>
    <br/><button class="setup-skip" id="setupSkip">同期なしでオフラインで使う</button>
  </div>
</div>

<!-- ══════ APP ══════ -->
<div id="app" class="hidden">

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">フォルダ</span>
      <div class="sb-hdr-btns">
        <button class="icon-btn" id="themeBtn" title="テーマ切り替え">🌙</button>
      </div>
    </div>
    <div class="sidebar-search">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="globalSearch" placeholder="検索"/>
    </div>
    <div class="folder-list" id="folderList"></div>
    <div class="sidebar-footer">
      <button class="sb-foot-btn" id="newFolderBtn">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
        新規フォルダ
      </button>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════
   SAFE STORAGE — localStorage が使えない環境に対応
═══════════════════════════════════════════════════ */
const SafeStorage = (() => {
  let _mem = {};
  let _ok = false;
  try {
    localStorage.setItem('__test__', '1');
    localStorage.removeItem('__test__');
    _ok = true;
  } catch(e) { _ok = false; }
  return {
    get(k)    { return _ok ? localStorage.getItem(k)     : (_mem[k] ?? null); },
    set(k, v) { if(_ok) localStorage.setItem(k, v);  else _mem[k] = v; },
    del(k)    { if(_ok) localStorage.removeItem(k);  else delete _mem[k]; },
    available: _ok,
  };
})();

/* ═══════════════════════════════════════════════════
   THEME
═══════════════════════════════════════════════════ */
let _theme = SafeStorage.get('notes_theme') || 'light';
function applyTheme(t){
  _theme = t;
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : '');
  const isDark = t === 'dark';
  document.getElementById('themeBtn').textContent    = isDark ? '☀️' : '🌙';
  document.getElementById('setupThemeBtn').textContent = isDark ? '☀️ ライトモード' : '🌙 ダークモード';
  SafeStorage.set('notes_theme', t);
}
applyTheme(_theme);

document.getElementById('themeBtn').addEventListener('click', () => applyTheme(_theme === 'dark' ? 'light' : 'dark'));
document.getElementById('setupThemeBtn').addEventListener('click', () => applyTheme(_theme === 'dark' ? 'light' : 'dark'));

/* ═══════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════ */
const S = {
  token: '', gistId: '',
  folders: [], notes: [],
  folderId: 'all', noteId: null,
  query: '', sort: 'edited',
  saveTimer: null,
};
const GIST_FILE = 'notes-app-data.json';

/* ═══════════════════════════════════════════════════
   STORAGE
═══════════════════════════════════════════════════ */
function saveLocal() {
  try {
    SafeStorage.set('notes_data', JSON.stringify({ folders: S.folders, notes: S.notes, gistId: S.gistId }));
  } catch(e) {}
}
function loadLocal() {
  try {
    const d = JSON.parse(SafeStorage.get('notes_data') || '{}');
    if(d.folders) S.folders = d.folders;
    if(d.notes)   S.notes   = d.notes;
    if(d.gistId)  S.gistId  = d.gistId;
  } catch(e) {}
}

/* ═══════════════════════════════════════════════════
   GITHUB GIST API
═══════════════════════════════════════════════════ */
async function ghFetch(method, path, body) {
  const res = await fetch('https://api.github.com' + path, {
    method,
    headers: {
      'Authorization': 'Bearer ' + S.token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if(!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.message || res.statusText);
  }
  return res.status === 204 ? null : res.json();
}

async function findOrCreateGist() {
  const list = await ghFetch('GET', '/gists?per_page=100');
  const ex = list.find(g => g.files && g.files[GIST_FILE]);
  if(ex) { S.gistId = ex.id; return; }
  const c = await ghFetch('POST', '/gists', {
    description: 'Notes App Data', public: false,
    files: { [GIST_FILE]: { content: JSON.stringify({ folders:[], notes:[] }) } }
  });
  S.gistId = c.id;
}

async function syncFromGist() {
  if(!S.token || !S.gistId) return;
  setSyncSt('syncing');
  try {
    const g = await ghFetch('GET', `/gists/${S.gistId}`);
    const file = g.files[GIST_FILE];
    const txt = file.truncated ? await fetch(file.raw_url).then(r=>r.text()) : file.content;
    const d = JSON.parse(txt);
    S.folders = d.folders || [];
    S.notes   = d.notes   || [];
    saveLocal();
    setSyncSt('ok');
    toast('同期しました ✓');
  } catch(e) {
    setSyncSt('err');
    toast('同期エラー: ' + e.message);
  }
}

async function syncToGist() {
  if(!S.token || !S.gistId) return;
  setSyncSt('syncing');
  try {
    const content = JSON.stringify({ folders: S.folders, notes: S.notes }, null, 2);
    await ghFetch('PATCH', `/gists/${S.gistId}`, { files: { [GIST_FILE]: { content } } });
    setSyncSt('ok');
  } catch(e) {
    setSyncSt('err');
    toast('保存エラー: ' + e.message);
  }
}

function setSyncSt(s) { document.getElementById('syncBadge').className = s; }

/* ═══════════════════════════════════════════════════
   SETUP
═══════════════════════════════════════════════════ */
document.getElementById('setupBtn').addEventListener('click', async () => {
  const token = document.getElementById('setupToken').value.trim();
  if(!token) { document.getElementById('setupError').textContent = 'トークンを入力してください'; return; }
  const btn = document.getElementById('setupBtn');
  btn.textContent = '接続中…'; btn.disabled = true;
  document.getElementById('setupError').textContent = '';
  try {
    S.token = token;
    await findOrCreateGist();
    SafeStorage.set('notes_token', token);
    saveLocal();
    await bootApp(true);
  } catch(e) {
    document.getElementById('setupError').textContent = 'エラー: ' + e.message;
    btn.textContent = '接続してはじめる'; btn.disabled = false;
    S.token = '';
  }
});

document.getElementById('setupSkip').addEventListener('click', () => bootApp(false));
document.getElementById('setupToken').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('setupBtn').click(); });

/* ═══════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════ */
async function bootApp(withSync) {
  loadLocal();
  if(withSync) await syncFromGist();
  if(S.folders.length === 0) {
    S.folders.push({ id: uid(), name: 'メモ', icon: '📝' });
    saveLocal();
  }
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('app').classList.remove('hidden');
  renderAll();
}

window.addEventListener('DOMContentLoaded', () => {
  const token = SafeStorage.get('notes_token');
  if(token) {
    S.token = token;
    loadLocal();
    findOrCreateGist()
      .then(() => syncFromGist())
      .then(() => {
        if(S.folders.length === 0) S.folders.push({ id: uid(), name: 'メモ', icon: '📝' });
        document.getElementById('setupScreen').style.display = 'none';
        document.getElementById('app').classList.remove('hidden');
        renderAll();
      })
      .catch(() => { SafeStorage.del('notes_token'); });
  }
});

/* ═══════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function fmtDate(ts) {
  const d = new Date(ts), now = new Date(), diff = now - d;
  if(diff < 60000) return 'たった今';
  if(diff < 3600000) return Math.floor(diff/60000) + '分前';
  if(diff < 86400000) return Math.floor(diff/3600000) + '時間前';
  if(diff < 604800000) return Math.floor(diff/86400000) + '日前';
  return d.toLocaleDateString('ja-JP', { month:'short', day:'numeric' });
}

function stripHtml(h) { return (h||'').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim(); }

function filteredNotes() {
  let ns = S.folderId === 'all' ? [...S.notes]
         : S.folderId === 'pinned' ? S.notes.filter(n => n.pinned)
         : S.notes.filter(n => n.folderId === S.folderId);
  if(S.query) {
    const q = S.query.toLowerCase();
    ns = ns.filter(n => n.title.toLowerCase().includes(q) || stripHtml(n.body).toLowerCase().includes(q));
  }
  const pin = ns.filter(n => n.pinned), rest = ns.filter(n => !n.pinned);
  const srt = arr => {
    if(S.sort === 'title') return arr.sort((a,b) => a.title.localeCompare(b.title, 'ja'));
    if(S.sort === 'created') return arr.sort((a,b) => b.createdAt - a.createdAt);
    return arr.sort((a,b) => b.updatedAt - a.updatedAt);
  };
  return [...srt(pin), ...srt(rest)];
}

/* ═══════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════ */
function renderAll() { renderFolders(); renderNoteList(); renderDetail(); }

function renderFolders() {
  const allCnt = S.notes.length;
  const pinCnt = S.notes.filter(n => n.pinned).length;
  let h = `
    <div class="folder-sec">スマートフォルダ</div>
    <div class="folder-item${S.folderId==='all'?' active':''}" data-fid="all">
      <span class="fi-icon">📋</span><span class="fi-name">すべてのメモ</span><span class="fi-cnt">${allCnt}</span>
    </div>
    <div class="folder-item${S.folderId==='pinned'?' active':''}" data-fid="pinned">
      <span class="fi-icon">📌</span><span class="fi-name">ピン留め</span><span class="fi-cnt">${pinCnt}</span>
    </div>
    <div class="folder-sec" style="margin-top:6px">フォルダ</div>`;
  S.folders.forEach(f => {
    const c = S.notes.filter(n => n.folderId === f.id).length;
    h += `<div class="folder-item${S.folderId===f.id?' active':''}" data-fid="${f.id}">
      <span class="fi-icon">${f.icon||'📁'}</span>
      <span class="fi-name">${esc(f.name)}</span>
      <span class="fi-cnt">${c}</span>
    </div>`;
  });
  const fl = document.getElementById('folderList');
  fl.innerHTML = h;
  fl.querySelectorAll('.folder-item').forEach(el => {
    el.addEventListener('click', () => {
      S.folderId = el.dataset.fid;
      S.noteId = null;
      renderAll(); closeSidebar();
    });
    el.addEventListener('dblclick', () => {
      const fid = el.dataset.fid;
      if(fid==='all'||fid==='pinned') return;
      const f = S.folders.find(x => x.id===fid);
      if(f) openFolderModal('rename', f);
    });
    el.addEventListener('contextmenu', e => {
      e.preventDefault();
      const fid = el.dataset.fid;
      if(fid==='all'||fid==='pinned') return;
      const f = S.folders.find(x => x.id===fid);
      if(f) openFolderModal('rename', f);
    });
  });

  // List title
  const tf = S.folderId==='all' ? 'すべてのメモ'
           : S.folderId==='pinned' ? 'ピン留め'
           : (S.folders.find(f => f.id===S.folderId)||{name:'メモ'}).name;
  document.getElementById('listTitle').textContent = tf;
}

function renderNoteList() {
  const ns = filteredNotes();
  document.getElementById('noteCntLabel').textContent = ns.length + '件';
  const el = document.getElementById('noteCards');
  if(ns.length === 0) {
    el.innerHTML = `<div class="list-empty"><div class="list-empty-icon">📭</div><div>メモがありません</div></div>`;
    return;
  }
  el.innerHTML = '';
  ns.forEach(n => {
    const d = document.createElement('div');
    d.className = 'note-card' + (S.noteId===n.id?' active':'');
    d.dataset.nid = n.id;
    const folder = S.folders.find(f => f.id===n.folderId);
    const prev = stripHtml(n.body).slice(0, 55) || '内容なし';
    d.innerHTML = `
      <div class="nc-title">${esc(n.title)||'タイトルなし'}</div>
      <div class="nc-meta">
        ${n.pinned?'<span>📌</span>':''}
        <span>${fmtDate(n.updatedAt)}</span>
        <span style="opacity:.4">·</span>
        <span>${esc(folder?.name||'')}</span>
      </div>
      <div class="nc-prev">${esc(prev)}</div>
      <div class="nc-actions">
        <button class="nca-btn nca-pin" data-nid="${n.id}">${n.pinned?'📌解':'📌'}</button>
        <button class="nca-btn nca-del" data-nid="${n.id}">🗑</button>
      </div>`;
    d.addEventListener('click', e => {
      if(e.target.closest('.nca-btn')) return;
      selectNote(n.id);
    });
    d.querySelector('.nca-pin').addEventListener('click', e => { e.stopPropagation(); togglePin(n.id); });
    d.querySelector('.nca-del').addEventListener('click', e => { e.stopPropagation(); confirmDel(n.id); });
    el.appendChild(d);
  });
}

function renderDetail() {
  const note = S.notes.find(n => n.id === S.noteId);
  const empty = document.getElementById('detailEmpty');
  const content = document.getElementById('detailContent');
  if(!note) {
    empty.style.display = 'flex';
    content.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  content.style.display = 'flex';
  const ed = document.getElementById('editor');
  if(ed.innerHTML !== (note.body||'')) ed.innerHTML = note.body || '';
  document.getElementById('pinBtn').style.opacity = note.pinned ? '1' : '0.45';
  document.getElementById('dtMeta').textContent = fmtDate(note.updatedAt) + (note.pinned?' · 📌':'');
  updateWC();
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ═══════════════════════════════════════════════════
   NOTE ACTIONS
═══════════════════════════════════════════════════ */
function createNote() {
  const fid = (S.folderId==='all'||S.folderId==='pinned')
    ? (S.folders[0]||{id:''}).id
    : S.folderId;
  const note = { id:uid(), title:'', body:'', folderId:fid, pinned:false, createdAt:Date.now(), updatedAt:Date.now() };
  S.notes.unshift(note);
  S.noteId = note.id;
  saveLocal(); schedSync();
  renderAll();
  setTimeout(() => { document.getElementById('editor').focus(); showDetailMobile(); }, 60);
}

function selectNote(id) {
  S.noteId = id;
  renderNoteList(); renderDetail();
  showDetailMobile();
}

function togglePin(id) {
  const n = S.notes.find(x => x.id===id); if(!n) return;
  n.pinned = !n.pinned; n.updatedAt = Date.now();
  saveLocal(); schedSync();
  renderAll();
  toast(n.pinned ? 'ピン留めしました' : 'ピン留めを解除しました');
}

function confirmDel(id) {
  const n = S.notes.find(x => x.id===id); if(!n) return;
  openConfirm(`「${n.title||'このメモ'}」を削除しますか？`, 'この操作は取り消せません。', () => {
    S.notes = S.notes.filter(x => x.id!==id);
    if(S.noteId===id) S.noteId = null;
    saveLocal(); schedSync();
    renderAll(); toast('削除しました');
  });
}

/* ═══════════════════════════════════════════════════
   EDITOR
═══════════════════════════════════════════════════ */
const editor = document.getElementById('editor');
let _lastSavedId = null;

editor.addEventListener('input', () => {
  const note = S.notes.find(n => n.id===S.noteId); if(!note) return;
  note.body = editor.innerHTML;
  note.title = stripHtml(editor.innerHTML).split('\n')[0].slice(0, 60) || '';
  note.updatedAt = Date.now();
  updateWC();
  saveLocal(); debSave();
});

editor.addEventListener('keydown', e => {
  if(e.key==='Tab') { e.preventDefault(); document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;'); }
});

/* ── Paste: handle images from clipboard ── */
editor.addEventListener('paste', e => {
  const items = e.clipboardData?.items;
  if(!items) return;
  for(const item of items) {
    if(item.type.startsWith('image/')) {
      e.preventDefault();
      const file = item.getAsFile();
      readAndInsertImage(file);
      return;
    }
  }
  // Plain text fallback (strip rich HTML from external sources)
  // Allow default for text
});

function readAndInsertImage(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = `<img src="${ev.target.result}" alt="image" style="max-width:100%;border-radius:8px;" draggable="true"/>`;
    document.execCommand('insertHTML', false, img);
    saveNoteNow();
  };
  reader.readAsDataURL(file);
}

function saveNoteNow() {
  const note = S.notes.find(n => n.id===S.noteId); if(!note) return;
  note.body = editor.innerHTML;
  note.title = stripHtml(editor.innerHTML).split('\n')[0].slice(0, 60) || '';
  note.updatedAt = Date.now();
  saveLocal(); schedSync();
  renderNoteList();
}

function updateWC() {
  const t = stripHtml(editor.innerHTML);
  document.getElementById('wcBar').textContent = t.length + ' 文字 / ' + t.split(/\s+/).filter(Boolean).length + ' 語';
}

let _debTimer;
function debSave() { clearTimeout(_debTimer); _debTimer = setTimeout(() => { schedSync(); renderNoteList(); }, 1200); }
function schedSync() {
  if(!S.token) return;
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(() => syncToGist(), 2500);
}

/* ═══════════════════════════════════════════════════
   FORMAT BAR
═══════════════════════════════════════════════════ */
document.querySelectorAll('.fb[data-cmd]').forEach(btn => {
  btn.addEventListener('mousedown', e => {
    e.preventDefault();
    document.execCommand(btn.dataset.cmd, false, btn.dataset.val || null);
    editor.focus();
  });
});

document.getElementById('checkBtn').addEventListener('mousedown', e => {
  e.preventDefault();
  document.execCommand('insertHTML', false,
    '<div><input type="checkbox" onchange="this.parentElement.style.textDecoration=this.checked?\'line-through\':\'none\';this.parentElement.style.color=this.checked?\'var(--text-m)\':\'inherit\'"/> <span>タスク</span></div>');
  editor.focus();
});

/* ═══════════════════════════════════════════════════
   IMAGE INSERT MODAL
═══════════════════════════════════════════════════ */
let _savedRange = null;

document.getElementById('imgInsertBtn').addEventListener('mousedown', e => {
  e.preventDefault();
  // Save cursor position
  const sel = window.getSelection();
  if(sel.rangeCount) _savedRange = sel.getRangeAt(0).cloneRange();
  document.getElementById('imgUrlInput').value = '';
  openModal('imgModal');
});

document.getElementById('imgCancel').addEventListener('click', () => closeModal('imgModal'));
document.getElementById('imgModal').addEventListener('click', e => { if(e.target.id==='imgModal') closeModal('imgModal'); });

// File input
document.getElementById('imgFileInput').addEventListener('change', e => {
  const file = e.target.files[0]; if(!file) return;
  readAndInsertImageFromModal(file);
  document.getElementById('imgFileInput').value = '';
});

// Drag & drop in modal
const imgDZ = document.getElementById('imgDropZone');
imgDZ.addEventListener('dragover', e => { e.preventDefault(); imgDZ.classList.add('over'); });
imgDZ.addEventListener('dragleave', () => imgDZ.classList.remove('over'));
imgDZ.addEventListener('drop', e => {
  e.preventDefault(); imgDZ.classList.remove('over');
  const file = e.dataTransfer.files[0];
  if(file && file.type.startsWith('image/')) readAndInsertImageFromModal(file);
});

function readAndInsertImageFromModal(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    insertImageAtSavedRange(ev.target.result);
    closeModal('imgModal');
    toast('画像を挿入しました');
  };
  reader.readAsDataURL(file);
}

document.getElementById('imgConfirm').addEventListener('click', () => {
  const url = document.getElementById('imgUrlInput').value.trim();
  if(url) {
    insertImageAtSavedRange(url);
    closeModal('imgModal');
    toast('画像を挿入しました');
  }
});

function insertImageAtSavedRange(src) {
  editor.focus();
  if(_savedRange) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(_savedRange);
  }
  document.execCommand('insertHTML', false,
    `<img src="${src}" alt="image" style="max-width:100%;border-radius:8px;display:block;margin:6px 0;" draggable="true"/>`);
  saveNoteNow();
}

/* ── Click image to select ── */
editor.addEventListener('click', e => {
  if(e.target.tagName==='IMG') {
    document.querySelectorAll('#editor img').forEach(i => i.classList.remove('img-selected'));
    e.target.classList.add('img-selected');
  } else {
    document.querySelectorAll('#editor img').forEach(i => i.classList.remove('img-selected'));
  }
});

/* ── Delete selected image with Backspace/Delete ── */
editor.addEventListener('keydown', e => {
  if((e.key==='Backspace'||e.key==='Delete') && document.querySelector('#editor img.img-selected')) {
    e.preventDefault();
    document.querySelector('#editor img.img-selected').remove();
    saveNoteNow();
  }
});

/* ═══════════════════════════════════════════════════
   TOOLBAR BUTTONS
═══════════════════════════════════════════════════ */
document.getElementById('newNoteBtn').addEventListener('click', createNote);
document.getElementById('pinBtn').addEventListener('click', () => { if(S.noteId) togglePin(S.noteId); });
document.getElementById('delNoteBtn').addEventListener('click', () => { if(S.noteId) confirmDel(S.noteId); });
document.getElementById('syncBtn').addEventListener('click', async () => {
  if(!S.token) { toast('トークンが未設定です'); return; }
  await syncFromGist(); renderAll();
});
document.getElementById('sortSel').addEventListener('change', e => { S.sort = e.target.value; renderNoteList(); });

document.getElementById('backToList').addEventListener('click', () => {
  S.noteId = null;
  document.getElementById('noteList').classList.remove('hidden-m');
  document.getElementById('noteDetail').classList.add('hidden-m');
  renderNoteList();
});

/* ═══════════════════════════════════════════════════
   SIDEBAR TOGGLE
═══════════════════════════════════════════════════ */
document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});
document.addEventListener('click', e => {
  const sb = document.getElementById('sidebar');
  if(sb.classList.contains('open') && !sb.contains(e.target) && e.target.id!=='sidebarToggle') closeSidebar();
});
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }

/* ═══════════════════════════════════════════════════
   MOBILE
═══════════════════════════════════════════════════ */
function showDetailMobile() {
  if(window.innerWidth <= 768) {
    document.getElementById('noteList').classList.add('hidden-m');
    document.getElementById('noteDetail').classList.remove('hidden-m');
  }
}
window.addEventListener('resize', () => {
  if(window.innerWidth > 768) {
    document.getElementById('noteList').classList.remove('hidden-m');
    document.getElementById('noteDetail').classList.remove('hidden-m');
  }
});

/* ═══════════════════════════════════════════════════
   SEARCH
═══════════════════════════════════════════════════ */
document.getElementById('globalSearch').addEventListener('input', e => {
  S.query = e.target.value;
  if(S.query) S.folderId = 'all';
  renderFolders(); renderNoteList();
});

/* ═══════════════════════════════════════════════════
   FOLDER MODAL
═══════════════════════════════════════════════════ */
let _fmMode = 'create', _fmTarget = null;

function openFolderModal(mode, folder=null) {
  _fmMode = mode; _fmTarget = folder;
  const inp = document.getElementById('fmInput');
  const title = document.getElementById('fmTitle');
  const btn = document.getElementById('fmConfirm');
  if(mode==='rename' && folder) {
    title.textContent = 'フォルダ名を変更';
    inp.value = folder.name;
    btn.textContent = '変更';
  } else {
    title.textContent = '新規フォルダ';
    inp.value = '';
    btn.textContent = '作成';
  }
  openModal('folderModal'); inp.focus();
}

document.getElementById('newFolderBtn').addEventListener('click', () => openFolderModal('create'));
document.getElementById('fmCancel').addEventListener('click', () => closeModal('folderModal'));
document.getElementById('folderModal').addEventListener('click', e => { if(e.target.id==='folderModal') closeModal('folderModal'); });
document.getElementById('fmConfirm').addEventListener('click', () => {
  const name = document.getElementById('fmInput').value.trim();
  if(!name) { toast('名前を入力してください'); return; }
  if(_fmMode==='create') {
    S.folders.push({ id:uid(), name, icon:'📁' });
    toast('フォルダを作成しました');
  } else if(_fmTarget) {
    _fmTarget.name = name;
    toast('名前を変更しました');
  }
  closeModal('folderModal');
  saveLocal(); schedSync(); renderFolders();
});
document.getElementById('fmInput').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('fmConfirm').click(); });

/* ═══════════════════════════════════════════════════
   MOVE FOLDER MODAL
═══════════════════════════════════════════════════ */
document.getElementById('moveBtn').addEventListener('click', () => {
  if(!S.noteId) return;
  const ml = document.getElementById('moveList');
  ml.innerHTML = '';
  S.folders.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'mfl-item';
    btn.innerHTML = `<span>${f.icon||'📁'}</span><span>${esc(f.name)}</span>`;
    btn.addEventListener('click', () => {
      const note = S.notes.find(n => n.id===S.noteId);
      if(note) { note.folderId = f.id; note.updatedAt = Date.now(); }
      saveLocal(); schedSync();
      closeModal('moveModal');
      renderAll(); toast(`「${f.name}」に移動しました`);
    });
    ml.appendChild(btn);
  });
  openModal('moveModal');
});
document.getElementById('moveCancel').addEventListener('click', () => closeModal('moveModal'));
document.getElementById('moveModal').addEventListener('click', e => { if(e.target.id==='moveModal') closeModal('moveModal'); });

/* ═══════════════════════════════════════════════════
   CONFIRM MODAL
═══════════════════════════════════════════════════ */
let _cfCb = null;
function openConfirm(title, desc, cb) {
  document.getElementById('cfTitle').textContent = title;
  document.getElementById('cfDesc').textContent = desc;
  _cfCb = cb;
  openModal('confirmModal');
}
document.getElementById('cfCancel').addEventListener('click', () => closeModal('confirmModal'));
document.getElementById('cfOk').addEventListener('click', () => { closeModal('confirmModal'); if(_cfCb){ _cfCb(); _cfCb=null; } });
document.getElementById('confirmModal').addEventListener('click', e => { if(e.target.id==='confirmModal') closeModal('confirmModal'); });

/* ═══════════════════════════════════════════════════
   MODAL HELPERS
═══════════════════════════════════════════════════ */
function openModal(id)  { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

/* ═══════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════ */
let _toastT;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ═══════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
═══════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if(mod && e.key==='n') { e.preventDefault(); createNote(); }
  if(mod && e.key==='s') { e.preventDefault(); if(S.token) { syncToGist(); toast('保存しました ✓'); } }
  if(e.key==='Escape') {
    document.querySelectorAll('.modal-bg').forEach(m => m.classList.remove('show'));
    closeSidebar();
  }
});
</script>
</body>
</html>
